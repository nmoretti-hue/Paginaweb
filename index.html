    <script>
    function myFunction() {
      var element = document.body;
      element.classList.toggle("dark-mode");

      var video = document.getElementById("video-fondo");
      video.style.filter = element.classList.contains("dark-mode")
        ? "brightness(0.25)"
        : "brightness(1)";
    }
    </script>
